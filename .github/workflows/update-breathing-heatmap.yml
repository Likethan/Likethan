name: Update Breathing Contribution Heatmap

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_breathing_heatmap.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate heatmap
        run: python scripts/generate_breathing_heatmap.py

      - name: Commit generated heatmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/contribution-wave.svg
          if git diff --cached --quiet; then
            echo "No heatmap changes."
          else
            git commit -m "chore: update breathing contribution heatmap"
            git push
          fi
