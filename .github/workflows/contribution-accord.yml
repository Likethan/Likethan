name: Accord Contribution Renderer

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render 2003 Accord contribution graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/generate_contribution_accord.py

      - name: Publish renderer
        run: |
          git config user.name "Likethan"
          git config user.email "173385979+Likethan@users.noreply.github.com"
          git add output/contribution-accord.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update Accord contribution graph"
          git push origin HEAD:main
