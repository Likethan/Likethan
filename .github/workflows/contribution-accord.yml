name: Accord Contribution Renderer

on:
  push:
    paths:
      - "scripts/generate_contribution_accord.py"
      - ".github/workflows/contribution-accord.yml"
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image renderer
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Fetch real GitHub contributions and refresh Accord
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_contribution_accord.py

      - name: Publish updated artwork
        run: |
          git config user.name "Likethan"
          git config user.email "173385979+Likethan@users.noreply.github.com"
          git add output/contribution-accord.jpg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh live Accord contribution artwork"
          git push origin HEAD:main
