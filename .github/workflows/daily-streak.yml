name: Daily GitHub Streak

on:
  schedule:
    - cron: "17 0 * * *"
  push:
    paths:
      - "scripts/generate_contribution_city.py"
      - ".github/workflows/daily-streak.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record daily contribution
        run: |
          git config user.name "Likethan"
          git config user.email "Likethan@users.noreply.github.com"
          printf '%s\n' "$(TZ=Asia/Kolkata date +%Y-%m-%d)" >> activity/daily-streak.log
          git add activity/daily-streak.log
          git commit -m "chore: maintain daily GitHub streak"
          git push origin HEAD:main

      - name: Generate 3D contribution city
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_contribution_city.py

      - name: Publish circuit graph
        run: |
          git config user.name "Likethan"
          git config user.email "Likethan@users.noreply.github.com"
          git add output/contribution-city.svg
          git commit -m "chore: update 3D contribution city" || exit 0
          git push origin HEAD:main
