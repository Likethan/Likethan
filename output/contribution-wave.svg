<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Likethan's 3D Contribution Terrain</title>
<desc id="desc">A true isometric contribution grid made from raised 3D cells, with animated elevation pulses.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050608"/><stop offset="1" stop-color="#111522"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5f3fc"/><stop offset=".45" stop-color="#6366f1"/><stop offset="1" stop-color="#312e81"/></linearGradient>
<linearGradient id="sideA" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4f46a5"/><stop offset="1" stop-color="#17182b"/></linearGradient>
<linearGradient id="sideB" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#373477"/><stop offset="1" stop-color="#11121e"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect x="20" y="45" width="1160" height="250" rx="16"/></clipPath>
</defs>
<rect width="1200" height="330" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="328" rx="19" fill="none" stroke="#fff" stroke-opacity=".08"/>
<text x="28" y="27" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">CONTRIBUTION TERRAIN</text>
<text x="1172" y="27" text-anchor="end" fill="#7d8590" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="1.5">3D ELEVATION / VOXELS / ACTIVITY</text>
<g clip-path="url(#clip)">
<!-- isometric ground grid -->
<g stroke="#64748b" stroke-opacity=".12" stroke-width="1" fill="none">
<path d="M110 270 L600 90 L1090 270"/><path d="M60 290 L600 92 L1140 290"/><path d="M180 295 L600 142 L1020 295"/>
<path d="M170 245 L1030 245"/><path d="M230 220 L970 220"/><path d="M300 195 L900 195"/><path d="M365 170 L835 170"/>
</g>

<!-- raised contribution cells; each cell is a small 3D prism -->
<g stroke="#0b0d16" stroke-width="1" stroke-linejoin="round">
<!-- row 1 -->
<g transform="translate(250 205)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 18 L0 12 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 12 L15 18 Z" fill="url(#sideA)"/></g>
<g transform="translate(300 187)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 27 L0 21 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 21 L15 27 Z" fill="url(#sideA)"/></g>
<g transform="translate(350 168)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 38 L0 32 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 32 L15 38 Z" fill="url(#sideA)"/></g>
<g transform="translate(400 191)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 23 L0 17 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 17 L15 23 Z" fill="url(#sideA)"/></g>
<g transform="translate(450 149)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 48 L0 42 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 42 L15 48 Z" fill="url(#sideA)"/></g>
<g transform="translate(500 175)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 31 L0 25 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 25 L15 31 Z" fill="url(#sideA)"/></g>
<g transform="translate(550 125)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 64 L0 58 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 58 L15 64 Z" fill="url(#sideA)"/></g>
<g transform="translate(600 155)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 40 L0 34 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 34 L15 40 Z" fill="url(#sideA)"/></g>
<g transform="translate(650 105)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 74 L0 68 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 68 L15 74 Z" fill="url(#sideA)"/></g>
<g transform="translate(700 140)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 48 L0 42 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 42 L15 48 Z" fill="url(#sideA)"/></g>
<g transform="translate(750 116)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 60 L0 54 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 54 L15 60 Z" fill="url(#sideA)"/></g>
<g transform="translate(800 154)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 38 L0 32 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 32 L15 38 Z" fill="url(#sideA)"/></g>
<g transform="translate(850 133)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 52 L0 46 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 46 L15 52 Z" fill="url(#sideA)"/></g>
<g transform="translate(900 170)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 30 L0 24 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 24 L15 30 Z" fill="url(#sideA)"/></g>
<!-- second staggered row -->
<g opacity=".92" transform="translate(275 225)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 15 L0 9 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 9 L15 15 Z" fill="url(#sideA)"/></g>
<g opacity=".92" transform="translate(325 207)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 22 L0 16 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 16 L15 22 Z" fill="url(#sideA)"/></g>
<g opacity=".92" transform="translate(375 218)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 32 L0 26 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 26 L15 32 Z" fill="url(#sideA)"/></g>
<g opacity=".92" transform="translate(425 198)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 42 L0 36 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 36 L15 42 Z" fill="url(#sideA)"/></g>
<g opacity=".92" transform="translate(475 215)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 20 L0 14 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 14 L15 20 Z" fill="url(#sideA)"/></g>
<g opacity=".92" transform="translate(525 190)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 52 L0 46 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 46 L15 52 Z" fill="url(#sideA)"/></g>
<g opacity=".92" transform="translate(575 207)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 34 L0 28 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 28 L15 34 Z" fill="url(#sideA)"/></g>
<g opacity=".92" transform="translate(625 185)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 60 L0 54 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 54 L15 60 Z" fill="url(#sideA)"/></g>
<g opacity=".92" transform="translate(675 203)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 30 L0 24 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 24 L15 30 Z" fill="url(#sideA)"/></g>
<g opacity=".92" transform="translate(725 180)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 50 L0 44 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 44 L15 50 Z" fill="url(#sideA)"/></g>
<g opacity=".92" transform="translate(775 205)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 24 L0 18 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 18 L15 24 Z" fill="url(#sideA)"/></g>
<g opacity=".92" transform="translate(825 192)"><path d="M0 0 L15 -6 L30 0 L15 6 Z" fill="url(#top)"/><path d="M0 0 L15 6 L15 42 L0 36 Z" fill="url(#sideB)"/><path d="M15 6 L30 0 L30 36 L15 42 Z" fill="url(#sideA)"/></g>
</g>

<!-- animated elevation scanner -->
<path d="M190 246 L600 96 L1010 246" fill="none" stroke="#8be9ff" stroke-width="2" stroke-opacity=".7" stroke-dasharray="35 70" filter="url(#glow)">
<animate attributeName="stroke-dashoffset" from="0" to="-315" dur="2.8s" repeatCount="indefinite"/>
</path>
<!-- pulsing high-activity beacon -->
<g transform="translate(665 105)" fill="#a5f3fc" filter="url(#glow)">
<circle r="4"><animate attributeName="r" values="4;10;4" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.15;1" dur="1.6s" repeatCount="indefinite"/></circle>
</g>
</g>
<text x="28" y="312" fill="#626b78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" letter-spacing="1.2">LOW ACTIVITY</text>
<text x="600" y="312" text-anchor="middle" fill="#626b78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" letter-spacing="1.2">EACH CONTRIBUTION BECOMES A RAISED 3D CELL</text>
<text x="1172" y="312" text-anchor="end" fill="#626b78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" letter-spacing="1.2">HIGH ACTIVITY</text>
</svg>