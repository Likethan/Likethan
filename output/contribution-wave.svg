<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">Likethan's Liquid Fill GitHub Contribution Graph</title>
<desc id="desc">A liquid-filled animated contribution visualization. Higher activity produces a higher liquid level.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090d"/><stop offset="1" stop-color="#11131b"/></linearGradient>
  <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#6e56cf"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1100" height="300" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1098" height="298" rx="23" fill="url(#grid)" stroke="#252936"/>
<text x="30" y="32" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1">LIQUID CONTRIBUTIONS</text>
<text x="1070" y="32" text-anchor="end" fill="#8f96a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.5">ACTIVITY → LIQUID LEVEL</text>

