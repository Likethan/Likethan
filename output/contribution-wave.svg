<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
<title id="title">Likethan's Wave Ripple GitHub Contribution Graph</title>
<desc id="desc">Animated contribution grid with a visible traveling wave and ripple effect.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080b"/><stop offset="1" stop-color="#10131a"/></linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#8be9ff"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="21" height="21" patternUnits="userSpaceOnUse"><rect width="15" height="15" rx="3" fill="#171a20"/><rect width="15" height="15" rx="3" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <clipPath id="clip"><rect x="28" y="48" width="1144" height="126" rx="12"/></clipPath>
</defs>
<rect width="1200" height="220" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="218" rx="17" fill="none" stroke="#fff" stroke-opacity=".08"/>
<text x="28" y="27" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">CONTRIBUTION RIPPLE</text>
<text x="1172" y="27" text-anchor="end" fill="#7d8590" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="1.5">WAVE / RIPPLE / FLOW</text>
<g clip-path="url(#clip)">
  <rect x="28" y="48" width="1144" height="126" fill="url(#grid)"/>
  <!-- Strong moving wave front -->
  <g filter="url(#glow)">
    <rect x="-100" y="38" width="120" height="146" fill="url(#wave)" opacity=".85" transform="skewX(-12)">
      <animate attributeName="x" from="-140" to="1220" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- Bright ripple pulses -->
  <g fill="none" stroke="#8be9ff" stroke-width="2" filter="url(#glow)">
    <circle cx="100" cy="111" r="10" opacity=".7">
      <animate attributeName="cx" values="100;1100;100" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="10;70;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0;.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="111" r="10" opacity=".55">
      <animate attributeName="cx" values="100;1100;100" dur="6s" begin=".65s" repeatCount="indefinite"/>
      <animate attributeName="r" values="10;70;10" dur="2s" begin=".65s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0;.6" dur="2s" begin=".65s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="111" r="10" opacity=".4">
      <animate attributeName="cx" values="100;1100;100" dur="6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="10;70;10" dur="2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".45;0;.45" dur="2s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Traveling sine wave -->
  <path d="M0 112 C120 65 200 159 320 112 S520 65 640 112 S840 159 960 112 S1080 65 1200 112" fill="none" stroke="#8be9ff" stroke-width="2" stroke-opacity=".55" filter="url(#glow)">
    <animate attributeName="d" dur="3.2s" repeatCount="indefinite" values="M0 112 C120 65 200 159 320 112 S520 65 640 112 S840 159 960 112 S1080 65 1200 112;M0 112 C120 159 200 65 320 112 S520 159 640 112 S840 65 960 112 S1080 159 1200 112;M0 112 C120 65 200 159 320 112 S520 65 640 112 S840 159 960 112 S1080 65 1200 112"/>
  </path>
</g>
<text x="28" y="199" fill="#626b78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" letter-spacing="1.2">LOW ACTIVITY</text>
<text x="600" y="199" text-anchor="middle" fill="#626b78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" letter-spacing="1.2">WAVE PULSE • RIPPLE • CONTRIBUTION FLOW</text>
<text x="1172" y="199" text-anchor="end" fill="#626b78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" letter-spacing="1.2">HIGH ACTIVITY</text>
</svg>