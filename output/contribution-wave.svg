<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">Likethan's animated GitHub contribution wave</title>
<desc id="desc">Animated 90-day contribution wave for the Likethan GitHub profile.</desc>
<defs>
<linearGradient id="line" x1="0" x2="1"><stop offset="0%" stop-color="#6E56CF"/><stop offset="52%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient>
<linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#7C5CFF" stop-opacity=".28"/><stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/></linearGradient>
<radialGradient id="dot"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="30%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#38BDF8"/></radialGradient>
<filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="100%" height="100%" rx="22" fill="#0B0D12"/><rect x="1" y="1" width="1098" height="298" rx="21" fill="none" stroke="#202532"/>
<text x="28" y="30" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">CONTRIBUTION WAVE</text>
<text x="1072" y="30" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="end">90 DAYS · LIVE ACTIVITY</text>
<g opacity=".22" stroke="#64748B" stroke-width="1"><line x1="52" y1="88" x2="1076" y2="88"/><line x1="52" y1="152" x2="1076" y2="152"/><line x1="52" y1="216" x2="1076" y2="216"/></g>
<path d="M52 228 C260 228 520 228 690 228 C745 228 770 214 795 194 C815 178 835 188 855 218 C875 240 895 224 915 205 C935 186 950 175 965 190 C982 207 997 170 1015 160 C1030 152 1042 188 1055 198 C1063 204 1070 201 1076 196 L1076 252 L52 252 Z" fill="url(#fill)"/>
<path d="M52 228 C260 228 520 228 690 228 C745 228 770 214 795 194 C815 178 835 188 855 218 C875 240 895 224 915 205 C935 186 950 175 965 190 C982 207 997 170 1015 160 C1030 152 1042 188 1055 198 C1063 204 1070 201 1076 196" fill="none" stroke="#7C5CFF" stroke-width="8" opacity=".18" filter="url(#glow)"/>
<path d="M52 228 C260 228 520 228 690 228 C745 228 770 214 795 194 C815 178 835 188 855 218 C875 240 895 224 915 205 C935 186 950 175 965 190 C982 207 997 170 1015 160 C1030 152 1042 188 1055 198 C1063 204 1070 201 1076 196" fill="none" stroke="url(#line)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1400" stroke-dashoffset="1400"><animate attributeName="stroke-dashoffset" from="1400" to="0" dur="2.8s" fill="freeze"/></path>
<g fill="url(#dot)"><circle cx="795" cy="194" r="4"><animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="855" cy="218" r="3.5"><animate attributeName="r" values="3.5;7;3.5" dur="2.2s" begin="-.7s" repeatCount="indefinite"/></circle><circle cx="965" cy="190" r="4.5"><animate attributeName="r" values="4.5;8;4.5" dur="2.2s" begin="-1.2s" repeatCount="indefinite"/></circle><circle cx="1015" cy="160" r="5"><animate attributeName="r" values="5;9;5" dur="2.2s" begin="-1.7s" repeatCount="indefinite"/></circle><circle cx="1076" cy="196" r="4"><animate attributeName="r" values="4;8;4" dur="2.2s" begin="-2s" repeatCount="indefinite"/></circle></g>
<g fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10"><text x="52" y="284">Jun 19</text><text x="390" y="284">Jul 18</text><text x="730" y="284">Aug 17</text><text x="1076" y="284" text-anchor="end">Sep 16</text><text x="28" y="284">LOW</text><text x="1072" y="284" text-anchor="end">HIGH ACTIVITY</text></g>
